name: Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-installer-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-installer-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg sidecars
        run: npm run setup:ffmpeg

      - name: Build Windows installer
        run: npm run tauri:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: HitPlayer-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
