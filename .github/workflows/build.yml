name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows fast check
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Create CI sidecar placeholders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          foreach ($name in @(
            "ffmpeg.exe",
            "ffprobe.exe",
            "ffmpeg-x86_64-pc-windows-msvc.exe",
            "ffprobe-x86_64-pc-windows-msvc.exe"
          )) {
            Set-Content -LiteralPath "src-tauri/binaries/$name" -Value "CI placeholder for compile checks only."
          }

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test
